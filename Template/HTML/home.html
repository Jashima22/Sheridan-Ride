<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/design-system.css">
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/mobile.css">
</head>
<body>

    <div class="container">

        <!-- ===== Header ===== -->
        <header class="home-header">
            <h1 class="page-title">Nice to see you, Ashley</h1>
        </header>

        <main>

            <!-- ===== Route card ===== -->
            <div class="card route-input">
                <div class="stop">
                    <img class="stop-marker" src="../images/icon-marker.svg" alt="">
                    <div>
                        <p class="stop-name">Lakeside Apartment</p>
                        <p class="small-text">144 Front St, Oakville</p>
                    </div>
                </div>

                <div class="stop">
                    <span class="marker-square stop-square"></span>
                    <div>
                        <p class="stop-name">Sheridan College</p>
                        <p class="small-text">Trafalgar Rd campus</p>
                    </div>
                </div>

                <!-- Divider line + swap button -->
                <div class="route-divider">
                    <span class="route-line"></span>
                    <button class="swap-btn" type="button">
                        <img src="../images/icon-refresh.svg" alt="">
                    </button>
                </div>
            </div>

            <!-- ===== Date & Time ===== -->
            <div class="field-row">
                <button class="field" type="button">
                    <img src="../images/icon-calendar.svg" alt="">
                    Oct 24, 2026
                </button>
                <button class="field" type="button">
                    <img src="../images/icon-clock.svg" alt="">
                    08:00 AM
                </button>
            </div>

            <!-- ===== Search button ===== -->
            <a class="btn btn-primary btn-large home-search-btn" href="search-results.html">Search rides</a>

            <!-- ===== Quick actions ===== -->
            <div class="home-chips">
                <button class="home-chip" type="button">
                    <span class="home-chip-icon"><img src="../images/icon-home-outline.svg" alt=""></span>
                    Add Home
                </button>
                <button class="home-chip" type="button">
                    <span class="home-chip-icon"><img src="../images/icon-star.svg" alt=""></span>
                    Save Places
                </button>
                <button class="home-chip" type="button">
                    <span class="home-chip-icon"><img src="../images/icon-location.svg" alt=""></span>
                    History
                </button>
            </div>

            <!-- ===== Map ===== -->
            <div class="home-map">
                <img src="../images/map.png" alt="">
            </div>

        </main>

    </div>

    <!-- ===== Bottom tab bar ===== -->
    <nav class="tab-bar">
        <a class="tab active" href="home.html">
            <span class="tab-icon"><img src="../images/icon-home-active.svg" alt=""></span>
            Home
        </a>
        <a class="tab" href="search-results.html">
            <span class="tab-icon"><img src="../images/icon-search.svg" alt=""></span>
            Find
        </a>
        <a class="tab" href="post-ride.html">
            <span class="tab-icon"><img src="../images/icon-add.svg" alt=""></span>
            Post
        </a>
        <a class="tab" href="#">
            <span class="tab-icon"><img src="../images/icon-activity.svg" alt=""></span>
            Activity
        </a>
    </nav>

</body>
</html>
